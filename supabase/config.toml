# Supabase CLI configuration for local development (`npm run db:start`).
# migrations/ here is GENERATED from packages/*/supabase/migrations by
# `npm run db:migrations:sync`. Edit the package files, never these copies.
# Reference: https://supabase.com/docs/guides/local-development/cli/config

project_id = "m-system"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# Demo data comes from `npm run db:seed` (TypeScript, so ticket QR codes are
# signed with your TICKETS_QR_SECRET), not from a seed.sql file.
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
